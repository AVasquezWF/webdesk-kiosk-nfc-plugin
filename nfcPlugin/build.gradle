plugins {
    id 'com.android.application'
}

android {
    buildToolsVersion: "29.0.2"
    compileSdk 28
    defaultConfig {
        minSdkVersion 22
    }
    defaultConfig {
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
        }
    }
}



dependencies {
    implementation 'org.apache.cordova:framework:9.0.0'
    implementation 'com.github.licheedev.Android-SerialPort-API:serialport:1.0.1'
    implementation fileTree(dir: 'lib', include: ['*.jar', '*.aar'])
}

