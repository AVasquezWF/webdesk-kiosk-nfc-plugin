plugins {
    id 'com.android.application'
}

android {
    compileSdk 28
    defaultConfig {
        minSdkVersion 28
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8

    }

}



dependencies {
    implementation 'org.apache.cordova:framework:9.0.0'
    implementation 'com.github.licheedev.Android-SerialPort-API:serialport:1.0.1'
    implementation fileTree(dir: 'lib', include: ['*.jar', '*.aar'])
    implementation fileTree(dir: 'lib/x86', include: ['*.so'])
    implementation fileTree(dir: 'lib/arm64-v8a', include: ['*.so'])
    implementation fileTree(dir: 'lib/armeabi-v7a', include: ['*.so'])
    implementation fileTree(dir: 'lib/x86_64', include: ['*.so'])
}

